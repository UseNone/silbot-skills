name: Refresh curated upstream skills
on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * *'
permissions:
  contents: write
concurrency:
  group: skills-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_upstream.py
      - name: Publish catalog when changed
        run: |
          git add skills catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'SilBot Skills'
          git config user.email 'skills@usenone.tech'
          git commit -m 'Update curated skills from upstream'
          git push origin HEAD:main
